name: PR Member Guard (Muara AI Only)

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  check-contributor:
    runs-on: ubuntu-latest
    steps:
      - name: Reject PRs from non-MuaraAI members
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const assoc = pr.author_association;
            const allowed = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);

            // Izinkan bot resmi GitHub/Dependabot jika sewaktu-waktu dipakai maintainer
            const isTrustedBot = pr.user.type === 'Bot' && ['dependabot[bot]', 'renovate[bot]'].includes(pr.user.login);

            if (allowed.has(assoc) || isTrustedBot) {
              core.info(`Authorized contributor @${pr.user.login} (association: ${assoc}).`);
              return;
            }

            const message = [
              `Halo @${pr.user.login}, terima kasih atas ketertarikannya terhadap **Mira**!`,
              '',
              'Sesuai kebijakan repositori ([CONTRIBUTING.md](https://github.com/MuaraAI/Mira/blob/main/CONTRIBUTING.md)), kontribusi Pull Request ke repositori ini **hanya dibuka untuk Anggota Muara AI yang berstatus mahasiswa aktif Universitas Bina Sarana Informatika (UBSI)**.',
              '',
              'Pull Request ini ditutup otomatis karena akun Anda belum terdaftar sebagai anggota/kolaborator organisasi **MuaraAI**.',
              '',
              '- Jika Anda adalah anggota Muara AI dan mahasiswa aktif UBSI, pastikan Anda sudah bergabung ke organisasi GitHub `MuaraAI` lalu hubungi maintainer (`@Curzyori`, `@MyKineID`, atau `@Seeyaa77`).',
              '- Jika Anda menemukan bug atau ingin mengusulkan perbaikan, silakan buka **GitHub Issue** menggunakan template yang tersedia.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: message,
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed',
            });
